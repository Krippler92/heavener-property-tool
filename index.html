      // ─── Auth wrapper ───
      function AppShell() {
        const [user, setUser] = useState(null);
        const [authLoading, setAuthLoading] = useState(true);
        const [authError, setAuthError] = useState(null);
        const [isAllowed, setIsAllowed] = useState(null);
        const [userRole, setUserRole] = useState(null);
        const [activeSection, setActiveSection] = useState('map');
        const [planContent, setPlanContent] = useState(null);
        const [planLoading, setPlanLoading] = useState(false);
        const [planError, setPlanError] = useState(null);
        const [flagsUnreadCount, setFlagsUnreadCount] = useState(0);
        const [notesOpen, setNotesOpen] = useState(false);
        const [notes, setNotes] = useState([]);
        const [composeTitle, setComposeTitle] = useState("");
        const [composeBody, setComposeBody] = useState("");
        const [replyingTo, setReplyingTo] = useState(null);
        const [replyBody, setReplyBody] = useState("");
        const [notesUnreadCount, setNotesUnreadCount] = useState(0);
        const [openLaborFlag, setOpenLaborFlag] = useState(null);
        const [laborFlagPanelMinimized, setLaborFlagPanelMinimized] = useState(false);
        const [laborFlagNotes, setLaborFlagNotes] = useState([]);
        const [laborFlagNoteBody, setLaborFlagNoteBody] = useState("");
        const [emailInput, setEmailInput] = useState("");
        const [emailLinkSending, setEmailLinkSending] = useState(false);
        const [emailLinkSent, setEmailLinkSent] = useState(false);
        const [emailLinkError, setEmailLinkError] = useState(null);
        const [completingEmailLink, setCompletingEmailLink] = useState(false);
        const [planConcerns, setPlanConcerns] = useState([]);
        const [openConcernForm, setOpenConcernForm] = useState(null);
        const [concernFormText, setConcernFormText] = useState("");
        const [wizardOpen, setWizardOpen] = useState(false);
        const [wizardStep, setWizardStep] = useState(1);
        const [wizardForm, setWizardForm] = useState({
          planType: '',
          title: '',
          description: '',
          specificGoals: '',
          timeline: '',
          contactPreference: '',
          extraInfo: '',
        });
        const [wizardSubmitting, setWizardSubmitting] = useState(false);
        const [wizardSubmitted, setWizardSubmitted] = useState(false);

        useEffect(() => {
          const unsub = window.firebaseOnAuthChange((u) => {
            setUser(u);
            setAuthLoading(false);
          });
          return () => unsub && unsub();
        }, []);

        useEffect(() => {
          if (!user) { setIsAllowed(null); setUserRole(null); return; }
          let cancelled = false;
          (async () => {
            const result = await window.firebaseCheckAllowedAndGetRole(user.email);
            if (!cancelled) {
              setIsAllowed(result.allowed);
              setUserRole(result.role);
            }
          })();
          return () => { cancelled = true; };
        }, [user]);

        useEffect(() => {
          if (!userRole) return;
          const canSeeMap = ['admin', 'family', 'friend'].includes(userRole);
          const canSeeNotes = ['admin', 'family', 'friend'].includes(userRole);
          const canSeeGetAPlan = ['admin', 'family'].includes(userRole);
          if (activeSection === 'map' && !canSeeMap) {
            setActiveSection('plan');
          }
          if (activeSection === 'notes' && !canSeeNotes) {
            setActiveSection('plan');
          }
          if (activeSection === 'get-a-plan' && !canSeeGetAPlan) {
            setActiveSection('plan');
          }
        }, [userRole, activeSection]);

        useEffect(() => {
          if (activeSection !== 'plan') return;
          if (planContent || planLoading) return;
          let cancelled = false;
          (async () => {
            setPlanLoading(true);
            setPlanError(null);
            try {
              const response = await fetch(
                'https://gist.githubusercontent.com/Krippler92/2ee4baa153bf01420d40729773896e20/raw/farm-plan-master.md'
              );
              if (!response.ok) throw new Error('HTTP ' + response.status);
              const text = await response.text();
              if (!cancelled) setPlanContent(text);
            } catch (err) {
              if (!cancelled) setPlanError(err.message);
            } finally {
              if (!cancelled) setPlanLoading(false);
            }
          })();
          return () => { cancelled = true; };
        }, [activeSection]);

        useEffect(() => {
          if (!user || !isAllowed) return;
          const unsub = window.firebaseNotesSubscribe((newNotes) => {
            setNotes(newNotes);
            const lastSeen = localStorage.getItem("heavener_last_seen_notes");
            if (!lastSeen) {
              setNotesUnreadCount(0);
            } else {
              const lastSeenDate = new Date(lastSeen);
              const unread = newNotes.filter(n =>
                n.authorUid !== user.uid && new Date(n.createdAt) > lastSeenDate
              ).length;
              setNotesUnreadCount(unread);
            }
          });
          return () => unsub();
        }, [user, isAllowed]);

        useEffect(() => {
          if (!user || !isAllowed) return;
          const unsub = window.firebasePlanConcernsSubscribe((concerns) => {
            setPlanConcerns(concerns);
          });
          return () => unsub();
        }, [user, isAllowed]);

        useEffect(() => {
          if (notesOpen) {
            localStorage.setItem("heavener_last_seen_notes", new Date().toISOString());
            setNotesUnreadCount(0);
          }
        }, [notesOpen]);

        useEffect(() => {
          if (!user || !isAllowed) return;
          const unsub = window.firebaseLaborFlagNotesSubscribe((notes) => {
            setLaborFlagNotes(notes);
          });
          return () => unsub();
        }, [user, isAllowed]);

        useEffect(() => {
          if (!notesOpen) return;
          const handleEsc = (e) => { if (e.key === 'Escape') setNotesOpen(false); };
          window.addEventListener('keydown', handleEsc);
          return () => window.removeEventListener('keydown', handleEsc);
        }, [notesOpen]);

        const handlePostNote = async () => {
          if (!composeBody.trim()) return;
          await window.firebaseAddNote({
            title: composeTitle.trim() || null,
            body: composeBody.trim(),
            authorUid: user.uid,
            authorName: user.displayName || user.email,
            authorEmail: user.email,
            createdAt: window.firebaseServerTimestamp(),
            parentNoteId: null,
          });
          setComposeTitle("");
          setComposeBody("");
        };

        const handlePostReply = async (parentId) => {
          if (!replyBody.trim()) return;
          await window.firebaseAddNote({
            body: replyBody.trim(),
            authorUid: user.uid,
            authorName: user.displayName || user.email,
            authorEmail: user.email,
            createdAt: window.firebaseServerTimestamp(),
            parentNoteId: parentId,
          });
          setReplyBody("");
          setReplyingTo(null);
        };

        const handleDeleteNote = async (id) => {
          if (!confirm("Delete this note?")) return;
          await window.firebaseDeleteNote(id);
        };

        const handlePostLaborFlagNote = async () => {
          if (!laborFlagNoteBody.trim() || !openLaborFlag) return;
          await window.firebaseAddLaborFlagNote({
            flagId: openLaborFlag.id,
            body: laborFlagNoteBody.trim(),
            authorUid: user.uid,
            authorName: user.displayName || user.email,
            authorEmail: user.email,
            createdAt: window.firebaseServerTimestamp(),
          });
          setLaborFlagNoteBody("");
        };

        const handleDeleteLaborFlagNote = async (id) => {
          if (!confirm("Delete this note?")) return;
          await window.firebaseDeleteLaborFlagNote(id);
        };

        const relativeTime = (iso) => {
          const ms = Date.now() - new Date(iso).getTime();
          if (ms < 60000) return "just now";
          if (ms < 3600000) return `${Math.floor(ms/60000)}m ago`;
          if (ms < 86400000) return `${Math.floor(ms/3600000)}h ago`;
          if (ms < 604800000) return `${Math.floor(ms/86400000)}d ago`;
          return new Date(iso).toLocaleDateString();
        };

        const handleSignIn = async () => {
          setAuthError(null);
          try {
            await window.firebaseSignIn();
          } catch (e) {
            setAuthError(e.message || "Sign-in failed");
          }
        };

        const handleSendEmailLink = async () => {
          const email = emailInput.trim().toLowerCase();
          if (!email || !email.includes("@")) {
            setEmailLinkError("Enter a valid email address.");
            return;
          }
          setEmailLinkSending(true);
          setEmailLinkError(null);
          try {
            await window.firebaseSendEmailLink(email);
            setEmailLinkSent(true);
            setEmailInput("");
          } catch (err) {
            setEmailLinkError(err.message || "Failed to send link. Try again.");
          } finally {
            setEmailLinkSending(false);
          }
        };

        useEffect(() => {
          if (!window.firebaseIsEmailLinkReturn || !window.firebaseIsEmailLinkReturn()) {
            return;
          }
          setCompletingEmailLink(true);
          let email = localStorage.getItem("heavener_email_for_signin");
          if (!email) {
            email = window.prompt("Confirm the email you used to request the sign-in link:");
          }
          if (!email) {
            setCompletingEmailLink(false);
            return;
          }
          window.firebaseCompleteEmailLinkSignIn(email)
            .then(() => {
              setCompletingEmailLink(false);
              window.history.replaceState({}, document.title, window.location.pathname);
            })
            .catch((err) => {
              setEmailLinkError("Sign-in link expired or invalid. Try requesting a new one.");
              setCompletingEmailLink(false);
            });
        }, []);

        const handleSignOut = async () => {
          try {
            await window.firebaseSignOut();
          } catch (e) {
            console.warn("sign-out failed:", e);
          }
        };

        const handlePostConcern = async (anchorHash, anchorContext) => {
          if (!concernFormText.trim()) return;
          await window.firebaseAddPlanConcern({
            anchorHash,
            anchorContext: anchorContext.slice(0, 100),
            concernText: concernFormText.trim(),
            authorUid: user.uid,
            authorName: user.displayName || user.email,
            authorEmail: user.email,
            createdAt: window.firebaseServerTimestamp(),
            resolved: false,
            resolvedAt: null,
            resolvedBy: null,
          });
          setConcernFormText("");
          setOpenConcernForm(null);
        };

        const handleResolveConcern = async (concernId) => {
          await window.firebaseUpdatePlanConcern(concernId, {
            resolved: true,
            resolvedAt: window.firebaseServerTimestamp(),
            resolvedBy: user.email,
          });
        };

        const handleUnresolveConcern = async (concernId) => {
          await window.firebaseUpdatePlanConcern(concernId, {
            resolved: false,
            resolvedAt: null,
            resolvedBy: null,
          });
        };

        const handleDeleteConcern = async (concernId) => {
          if (!confirm("Delete this concern?")) return;
          await window.firebaseDeletePlanConcern(concernId);
        };

        const handleSubmitPlanRequest = async () => {
          setWizardSubmitting(true);
          try {
            await window.firebaseAddPlanRequest({
              ...wizardForm,
              authorUid: user.uid,
              authorName: user.displayName || user.email,
              authorEmail: user.email,
              createdAt: window.firebaseServerTimestamp(),
              status: 'new',
              adminNotes: '',
              statusUpdatedAt: null,
            });
            setWizardSubmitted(true);
          } catch (err) {
            alert("Couldn't submit request: " + err.message);
          } finally {
            setWizardSubmitting(false);
          }
        };

        const resetWizard = () => {
          setWizardOpen(false);
          setWizardStep(1);
          setWizardForm({
            planType: '',
            title: '',
            description: '',
            specificGoals: '',
            timeline: '',
            contactPreference: '',
            extraInfo: '',
          });
          setWizardSubmitted(false);
        };

        const renderPlanWithConcerns = (markdown) => {
          const html = window.marked.parse(markdown);
          const parser = new DOMParser();
          const doc = parser.parseFromString(`<div>${html}</div>`, 'text/html');
          const container = doc.body.firstChild;
          const elements = Array.from(container.children);
          const sharedProps = {
            concerns: planConcerns,
            user,
            userRole,
            isAdmin: user.email === window.ADMIN_EMAIL,
            openConcernForm,
            setOpenConcernForm,
            concernFormText,
            setConcernFormText,
            handlePostConcern,
            handleResolveConcern,
            handleUnresolveConcern,
            handleDeleteConcern,
          };

          return elements.map((el, i) => {
            const tag = el.tagName.toLowerCase();
            if (tag === 'ul' || tag === 'ol') {
              return (
                <ListWithConcerns key={i} tag={tag} element={el} {...sharedProps} />
              );
            }
            if (['p', 'h1', 'h2', 'h3', 'h4', 'h5', 'h6', 'blockquote'].includes(tag)) {
              return (
                <ConcernAnchor
                  key={i}
                  tag={tag}
                  innerHtml={el.innerHTML}
                  textContent={el.textContent}
                  {...sharedProps}
                />
              );
            }
            return (
              <div key={i} dangerouslySetInnerHTML={{ __html: el.outerHTML }} />
            );
          });
        };

        if (authLoading) {
          return <div className="loading">Loading...</div>;
        }

        if (completingEmailLink) {
          return <div className="loading">Completing sign-in...</div>;
        }

        if (!user) {
          return (
            <div className="auth-screen">
              <div className="auth-card">
                <h1>Heavener Property Tool</h1>
                <p>Interactive 3D property layout with collaborative flag annotations. Sign in with Google to view the property and add your own flags.</p>
                <button className="auth-btn" onClick={handleSignIn}>
                  <svg viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
                  Sign in with Google
                </button>
                {authError && <div className="auth-error">{authError}</div>}
                <div className="email-signin-section">
                  <div className="email-signin-divider">— or —</div>
                  {emailLinkSent ? (
                    <div className="email-signin-status">
                      Check your email for a sign-in link. Click the link to complete sign-in. Safe to close this tab.
                    </div>
                  ) : (
                    <div className="email-signin-form">
                      <input
                        type="email"
                        className="email-signin-input"
                        placeholder="your-email@example.com"
                        value={emailInput}
                        onChange={(e) => setEmailInput(e.target.value)}
                        disabled={emailLinkSending}
                      />
                      <button
                        className="email-signin-btn"
                        onClick={handleSendEmailLink}
                        disabled={emailLinkSending || !emailInput.trim()}
                      >
                        {emailLinkSending ? "Sending..." : "Email me a sign-in link"}
                      </button>
                      {emailLinkError && (
                        <div className="email-signin-error">{emailLinkError}</div>
                      )}
                    </div>
                  )}
                </div>
              </div>
            </div>
          );
        }

        if (isAllowed === null) {
          return <div className="loading">Checking access...</div>;
        }
        if (isAllowed === false) {
          return <AccessRequired email={user.email} onSignOut={handleSignOut} />;
        }

        // Authenticated — show the main app with sidebar navigation
        const isAdmin = user.email === window.ADMIN_EMAIL;
        const unresolvedConcernsCount = isAdmin
          ? planConcerns.filter(c => !c.resolved).length
          : 0;
        return (
          <>
            <Sidebar
              activeSection={activeSection}
              onSectionChange={setActiveSection}
              onOpenNotes={() => setNotesOpen(true)}
              user={user}
              isAdmin={isAdmin}
              userRole={userRole}
              onSignOut={handleSignOut}
              notesUnreadCount={notesUnreadCount}
              flagsUnreadCount={flagsUnreadCount}
              planConcernsBadge={unresolvedConcernsCount}
            />
            <div className={`main-content section-${activeSection}`}>
              {activeSection === 'map' && ['admin', 'family', 'friend'].includes(userRole) && (
                <HeavenerProperty3D
                  currentUser={user}
                  isAdmin={isAdmin}
                  onFlagsUnreadCountChange={setFlagsUnreadCount}
                />
              )}
              {activeSection === 'plan' && (
                <div className="plan-view">
                  {planLoading && <div className="plan-view-loading">Loading farm plan…</div>}
                  {planError && <div className="plan-view-error">Couldn't load plan: {planError}</div>}
                  {planContent && (() => {
                    const filteredPlanContent = filterPlanByRole(planContent, userRole);
                    const canSeeLaborFlags = ['admin', 'family', 'friend'].includes(userRole);
                    if (!canSeeLaborFlags) {
                      return (
                        <div className="plan-content">{renderPlanWithConcerns(filteredPlanContent)}</div>
                      );
                    }
                    const laborFlagsRegex = /(\n## 🚩 Labor Flags[\s\S]*?)(?=\n## |\n# |$)/;
                    const match = filteredPlanContent.match(laborFlagsRegex);
                    const renderFlags = () => (
                      <div className="labor-flags-section">
                        <div className="labor-flags-title">🚩 Labor Flags</div>
                        <div className="labor-flags-intro">
                          Items requiring recurring physical labor that should be reduced via tool design. Tap any flag to see details and add notes.
                        </div>
                        {LABOR_FLAGS.map(flag => (
                          <div key={flag.id}
                               className={`labor-flag-card status-${flag.status.replace(' ', '_')}`}
                               onClick={() => { setOpenLaborFlag(flag); setLaborFlagPanelMinimized(false); }}>
                            <div className="labor-flag-card-header">
                              <span className="labor-flag-id">🚩 {flag.id}</span>
                              <span className={`labor-flag-status status-${flag.status.replace(' ', '_')}`}>{flag.status}</span>
                            </div>
                            <div className="labor-flag-card-title">{flag.title}</div>
                            <div className="labor-flag-card-hint">Tap for details and notes →</div>
                          </div>
                        ))}
                      </div>
                    );
                    if (!match) {
                      return (
                        <>
                          {renderFlags()}
                          <div className="plan-content">{renderPlanWithConcerns(filteredPlanContent)}</div>
                        </>
                      );
                    }
                    const before = filteredPlanContent.slice(0, match.index);
                    const after = filteredPlanContent.slice(match.index + match[0].length);
                    return (
                      <>
                        <div className="plan-content">{renderPlanWithConcerns(before)}</div>
                        {renderFlags()}
                        <div className="plan-content">{renderPlanWithConcerns(after)}</div>
                      </>
                    );
                  })()}
                </div>
              )}
              {activeSection === 'get-a-plan' && ['admin', 'family'].includes(userRole) && (
                <div className="gap-view">
                  {!wizardOpen && (
                    <div className="gap-hero">
                      <div className="gap-hero-icon">🏗️</div>
                      <div className="gap-hero-title">Get a Custom Plan</div>
                      <div className="gap-hero-subtitle">
                        Want Lee to build you a custom plan? Tell him what you want and he'll
                        handle the rest. You just need to share what's on your mind — Lee figures
                        out the details, does the work, and delivers the plan.
                      </div>
                      <button className="gap-cta-btn" onClick={() => setWizardOpen(true)}>
                        Start Your Request
                      </button>
                    </div>
                  )}
                  {wizardOpen && (
                    <PlanWizard
                      wizardStep={wizardStep}
                      setWizardStep={setWizardStep}
                      wizardForm={wizardForm}
                      setWizardForm={setWizardForm}
                      wizardSubmitting={wizardSubmitting}
                      wizardSubmitted={wizardSubmitted}
                      handleSubmitPlanRequest={handleSubmitPlanRequest}
                      resetWizard={resetWizard}
                    />
                  )}
                </div>
              )}
            </div>
            {notesOpen && (
              <div className="notes-modal-backdrop" onClick={() => setNotesOpen(false)}>
                <div className="notes-modal" onClick={e => e.stopPropagation()}>
                  <div className="notes-header">
                    <div className="notes-title">Family Notes</div>
                    <button className="notes-close" onClick={() => setNotesOpen(false)}>×</button>
                  </div>
                  <div className="notes-body">
                    <div className="notes-compose">
                      <input
                        type="text"
                        placeholder="Title (optional)"
                        value={composeTitle}
                        onChange={(e) => setComposeTitle(e.target.value)}
                      />
                      <textarea
                        placeholder="What's on your mind?"
                        value={composeBody}
                        onChange={(e) => setComposeBody(e.target.value)}
                      />
                      <button
                        className="notes-post-btn"
                        onClick={handlePostNote}
                        disabled={!composeBody.trim()}
                      >
                        Post note
                      </button>
                    </div>
                    {notes.filter(n => !n.parentNoteId).length === 0 ? (
                      <div className="notes-empty">No notes yet. Be the first to share something.</div>
                    ) : (
                      <div className="notes-list">
                        {notes
                          .filter(n => !n.parentNoteId)
                          .slice()
                          .reverse()
                          .map(note => {
                            const replies = notes.filter(r => r.parentNoteId === note.id);
                            const canDelete = isAdmin || note.authorUid === user.uid;
                            return (
                              <div key={note.id} className="notes-item">
                                <div className="notes-meta">
                                  <span className="notes-author">
                                    {note.authorName}{note.authorUid === user.uid ? " (you)" : ""}
                                  </span>
                                  {note.authorEmail === window.ADMIN_EMAIL &&
                                    <span className="notes-admin-badge">admin</span>}
                                  <span className="notes-time">· {relativeTime(note.createdAt)}</span>
                                </div>
                                {note.title && <div className="notes-item-title">{note.title}</div>}
                                <div className="notes-item-body">{note.body}</div>
                                <div className="notes-actions">
                                  <button className="notes-action" onClick={() => setReplyingTo(replyingTo === note.id ? null : note.id)}>Reply</button>
                                  {canDelete && (
                                    <button className="notes-action notes-action-delete" onClick={() => handleDeleteNote(note.id)}>Delete</button>
                                  )}
                                </div>
                                {replyingTo === note.id && (
                                  <div className="notes-reply-compose">
                                    <textarea
                                      placeholder="Write a reply..."
                                      value={replyBody}
                                      onChange={(e) => setReplyBody(e.target.value)}
                                      autoFocus
                                    />
                                    <div className="notes-reply-buttons">
                                      <button
                                        className="notes-reply-post"
                                        onClick={() => handlePostReply(note.id)}
                                        disabled={!replyBody.trim()}
                                      >
                                        Post reply
                                      </button>
                                      <button
                                        className="notes-reply-cancel"
                                        onClick={() => { setReplyingTo(null); setReplyBody(""); }}
                                      >
                                        Cancel
                                      </button>
                                    </div>
                                  </div>
                                )}
                                {replies.length > 0 && (
                                  <div className="notes-replies">
                                    {replies.map(reply => {
                                      const canDeleteReply = isAdmin || reply.authorUid === user.uid;
                                      return (
                                        <div key={reply.id} className="notes-item notes-item-reply">
                                          <div className="notes-meta">
                                            <span className="notes-author">
                                              {reply.authorName}{reply.authorUid === user.uid ? " (you)" : ""}
                                            </span>
                                            {reply.authorEmail === window.ADMIN_EMAIL &&
                                              <span className="notes-admin-badge">admin</span>}
                                            <span className="notes-time">· {relativeTime(reply.createdAt)}</span>
                                          </div>
                                          <div className="notes-item-body">{reply.body}</div>
                                          {canDeleteReply && (
                                            <div className="notes-actions">
                                              <button className="notes-action notes-action-delete" onClick={() => handleDeleteNote(reply.id)}>Delete</button>
                                            </div>
                                          )}
                                        </div>
                                      );
                                    })}
                                  </div>
                                )}
                              </div>
                            );
                          })}
                      </div>
                    )}
                  </div>
                </div>
              </div>
            )}
            {openLaborFlag && (
              <div className={`labor-flag-panel-backdrop${laborFlagPanelMinimized ? ' labor-flag-panel-minimized' : ''}`}>
                {laborFlagPanelMinimized && (
                  <div className="labor-flag-panel-tab"
                       onClick={() => setLaborFlagPanelMinimized(false)}>
                    {openLaborFlag.id}
                  </div>
                )}
                <div className="labor-flag-panel-header">
                  <span className="labor-flag-panel-id">🚩 {openLaborFlag.id}</span>
                  <span className={`labor-flag-status status-${openLaborFlag.status.replace(' ', '_')}`}>
                    {openLaborFlag.status}
                  </span>
                  <div className="labor-flag-panel-spacer" />
                  <button className="labor-flag-panel-btn"
                          title="Minimize"
                          onClick={() => setLaborFlagPanelMinimized(true)}>–</button>
                  <button className="labor-flag-panel-btn"
                          title="Close"
                          onClick={() => { setOpenLaborFlag(null); setLaborFlagNoteBody(""); }}>×</button>
                </div>
                <div className="labor-flag-panel-body">
                  <div className="labor-flag-panel-title">{openLaborFlag.title}</div>
                  <div className="labor-flag-panel-section">
                    <div className="labor-flag-panel-section-title">The Concern</div>
                    <div className="labor-flag-panel-section-body">{openLaborFlag.concern}</div>
                  </div>
                  <div className="labor-flag-panel-section">
                    <div className="labor-flag-panel-section-title">Action Required</div>
                    <div className="labor-flag-panel-section-body">{openLaborFlag.actionRequired}</div>
                  </div>
                  <div className="labor-flag-panel-section">
                    <div className="labor-flag-panel-section-title">Suggested Approach</div>
                    <div className="labor-flag-panel-section-body">{openLaborFlag.suggestedApproach}</div>
                  </div>
                  <div className="labor-flag-panel-section">
                    <div className="labor-flag-panel-section-title">Priority / Lesson</div>
                    <div className="labor-flag-panel-section-body">{openLaborFlag.priority}</div>
                  </div>
                  <div className="labor-flag-notes-section">
                    <div className="labor-flag-panel-section-title">Notes & Alternative Ideas</div>
                    <div className="labor-flag-note-compose">
                      <textarea
                        placeholder="Add a note — disagree with the suggestion, add context, propose an alternative..."
                        value={laborFlagNoteBody}
                        onChange={(e) => setLaborFlagNoteBody(e.target.value)}
                      />
                      <button onClick={handlePostLaborFlagNote} disabled={!laborFlagNoteBody.trim()}>Add note</button>
                    </div>
                    {laborFlagNotes.filter(n => n.flagId === openLaborFlag.id).length === 0 ? (
                      <div style={{color: '#666', fontSize: 12, fontStyle: 'italic', padding: '8px 0'}}>No notes yet.</div>
                    ) : (
                      laborFlagNotes
                        .filter(n => n.flagId === openLaborFlag.id)
                        .map(note => {
                          const canDelete = isAdmin || note.authorUid === user.uid;
                          return (
                            <div key={note.id} className="labor-flag-note">
                              <div className="labor-flag-note-meta">
                                <span className="labor-flag-note-author">
                                  {note.authorName}{note.authorUid === user.uid ? ' (you)' : ''}
                                </span>
                                <span>· {relativeTime(note.createdAt)}</span>
                              </div>
                              <div className="labor-flag-note-body">{note.body}</div>
                              {canDelete && (
                                <button className="labor-flag-note-delete"
                                        onClick={() => handleDeleteLaborFlagNote(note.id)}>
                                  Delete
                                </button>
                              )}
                            </div>
                          );
                        })
                    )}
                  </div>
                </div>
              </div>
            )}
          </>
        );
      }

      // Mount
      const root = ReactDOM.createRoot(document.getElementById("root"));
      root.render(<AppShell />);
    }

    if (window.firebaseReady) {
      mountApp();
    } else {
      window.addEventListener("firebase-ready", mountApp);
    }
  </script>
</body>
</html>
